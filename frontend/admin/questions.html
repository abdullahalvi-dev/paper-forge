<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Question Bank | Paper Forge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/dashboard.css" rel="stylesheet">
  </head>
  <body data-page="admin-questions">
    <div class="app-shell admin-shell">
      <aside class="sidebar"></aside>
      <main class="main">
        <div class="topbar admin-topbar">
          <div class="page-title"><h1>Question Bank</h1><p>Create, edit, delete, import, filter, and export MongoDB questions.</p></div>
          <button class="btn btn-outline-primary" id="exportQuestionsBtn"><i class="bi bi-download"></i> Export JSON</button>
        </div>

        <section class="metric-grid">
          <div class="metric-card"><span>Loaded</span><strong id="questionTotalCount">0</strong></div>
          <div class="metric-card"><span>MCQs</span><strong id="questionMcqCount">0</strong></div>
          <div class="metric-card"><span>Short</span><strong id="questionShortCount">0</strong></div>
          <div class="metric-card"><span>Long</span><strong id="questionLongCount">0</strong></div>
        </section>

        <div class="sales-grid">
          <section class="panel">
            <div class="panel-title">
              <h2 id="questionFormTitle">Create question</h2>
              <span class="muted">Add one question manually to the question bank.</span>
            </div>
            <form id="adminQuestionForm" class="form-grid">
              <div>
                <label class="form-label">Class</label>
                <select class="form-select" name="classLevel"><option>9th</option><option>10th</option><option>1st Year</option><option>2nd Year</option></select>
              </div>
              <div>
                <label class="form-label">Subject</label>
                <select class="form-select" name="subject"><option>Physics</option><option>Chemistry</option><option>Math</option></select>
              </div>
              <div>
                <label class="form-label">Chapter</label>
                <select class="form-select" name="chapter" required></select>
              </div>
              <div>
                <label class="form-label">Type</label>
                <select class="form-select" name="type"><option value="mcq">MCQ</option><option value="short">Short</option><option value="long">Long</option></select>
              </div>
              <div>
                <label class="form-label">Marks</label>
                <input class="form-control" name="marks" type="number" min="1" value="1">
              </div>
              <div><label class="form-label">Difficulty</label><select class="form-select" name="difficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div>
              <div class="span-2"><label class="form-label">Question</label><textarea class="form-control" name="question" rows="3" required></textarea></div>
              <div class="admin-mcq-field"><label class="form-label">MCQ options, one per line</label><textarea class="form-control" name="options" rows="4" placeholder="Option A&#10;Option B&#10;Option C&#10;Option D"></textarea></div>
              <div class="admin-mcq-field"><label class="form-label">Correct answer</label><input class="form-control" name="correctAnswer" placeholder="Must match one option"></div>
              <div class="span-2"><label class="form-label">Explanation</label><textarea class="form-control" name="explanation" rows="2"></textarea></div>
              <div class="span-2 check-row">
                <label class="check-pill"><input type="checkbox" name="isImportant"> Important</label>
                <button class="btn btn-primary" id="saveQuestionBtn" type="submit"><i class="bi bi-plus-circle"></i> Save Question</button>
                <button class="btn btn-outline-secondary" id="cancelQuestionEdit" type="button">Cancel Edit</button>
              </div>
            </form>
          </section>

          <section class="panel">
            <div class="panel-title"><h2>Bulk JSON Import</h2></div>
            <form id="questionJsonForm">
              <label class="form-label">Paste JSON array</label>
              <textarea class="form-control" name="json" rows="14" placeholder='[{"classLevel":"9th","subject":"Physics","chapter":"Kinematics","type":"mcq","question":"..."}]'></textarea>
              <button class="btn btn-dark mt-3" type="submit"><i class="bi bi-upload"></i> Import JSON</button>
            </form>
          </section>
        </div>

        <section class="panel">
          <div class="toolbar-row">
            <form id="questionFilterForm" class="d-flex gap-2 flex-wrap">
              <select class="form-select" name="classLevel"><option value="">All classes</option><option>9th</option><option>10th</option><option>1st Year</option><option>2nd Year</option></select>
              <select class="form-select" name="subject"><option value="">All subjects</option><option>Physics</option><option>Chemistry</option><option>Math</option></select>
              <select class="form-select" name="chapter"><option value="">All chapters</option></select>
              <select class="form-select" name="type"><option value="">All types</option><option value="mcq">MCQ</option><option value="short">Short</option><option value="long">Long</option></select>
              <button class="btn btn-outline-primary" type="submit">Apply</button>
            </form>
          </div>
          <div class="table-responsive">
            <table class="table align-middle compact-table">
              <thead><tr><th>Class</th><th>Subject</th><th>Chapter</th><th>Type</th><th>Question</th><th>Actions</th></tr></thead>
              <tbody id="adminQuestionsBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <div id="appToast" hidden></div>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
