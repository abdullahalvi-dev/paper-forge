<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payments | Paper Forge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/dashboard.css" rel="stylesheet">
  </head>
  <body data-page="admin-payments">
    <div class="app-shell admin-shell">
      <aside class="sidebar"></aside>
      <main class="main">
        <div class="topbar admin-topbar">
          <div class="page-title"><h1>Payments</h1><p>Gateway, demo, Stripe, Jazzcash, and manual transaction records.</p></div>
          <button class="btn btn-outline-primary" id="exportPaymentsBtn"><i class="bi bi-download"></i> Export CSV</button>
        </div>

        <section class="metric-grid">
          <div class="metric-card"><span>Total Payments</span><strong id="paymentsTotalCount">0</strong></div>
          <div class="metric-card"><span>Revenue</span><strong id="paymentsRevenueCount">PKR 0</strong></div>
          <div class="metric-card"><span>Pending</span><strong id="paymentsPendingCount">0</strong></div>
          <div class="metric-card"><span>Jazzcash</span><strong style="font-size:1.35rem">03047775129</strong></div>
        </section>

        <section class="panel">
          <div class="table-responsive">
            <table class="table align-middle compact-table">
              <thead><tr><th>User</th><th>Plan</th><th>Provider</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
              <tbody id="paymentsBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <div id="appToast" hidden></div>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
