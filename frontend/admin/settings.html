<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings | Paper Forge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/dashboard.css" rel="stylesheet">
  </head>
  <body data-page="admin-settings">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><img class="brand-logo" src="../assets/images/Logo.svg" alt="Paper Forge"><span class="brand-role">Admin</span></div>
        <a href="/dashboard/admin-dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/admin/users.html"><i class="bi bi-people"></i> Users</a>
        <a href="/admin/questions.html"><i class="bi bi-database"></i> Questions</a>
        <a href="/admin/past-papers.html"><i class="bi bi-folder2-open"></i> Past Papers</a>
        <a href="/admin/payments.html"><i class="bi bi-receipt"></i> Payments</a>
        <a class="active" href="/admin/settings.html"><i class="bi bi-gear"></i> Settings</a>
        <button class="js-logout"><i class="bi bi-box-arrow-left"></i> Logout</button>
      </aside>
      <main class="main">
        <div class="topbar"><div class="page-title"><h1>Settings</h1><p>Paper limits, practice timer, pricing, Jazzcash details.</p></div></div>
        <section class="panel">
          <form id="settingsForm" class="form-grid">
            <div><label class="form-label">Full Paper MCQs</label><input class="form-control" name="mcq" type="number" value="100"></div>
            <div><label class="form-label">Full Paper Short</label><input class="form-control" name="short" type="number" value="50"></div>
            <div><label class="form-label">Full Paper Long</label><input class="form-control" name="long" type="number" value="20"></div>
            <div><label class="form-label">Practice MCQs</label><input class="form-control" name="practiceMcqLimit" type="number" value="20"></div>
            <div><label class="form-label">Monthly PKR</label><input class="form-control" name="monthly" type="number" value="2000"></div>
            <div><label class="form-label">Yearly PKR</label><input class="form-control" name="yearly" type="number" value="20000"></div>
            <div><label class="form-label">Jazzcash Number</label><input class="form-control" name="jazzcashNumber" value="03047775129"></div>
            <div><label class="form-label">Jazzcash Name</label><input class="form-control" name="jazzcashName" value="Muhammad Abdullah Alvi"></div>
            <div class="span-2"><button class="btn btn-primary" type="submit">Save Settings</button></div>
          </form>
        </section>
      </main>
    </div>
    <div id="appToast" hidden></div>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
