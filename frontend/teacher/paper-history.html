<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paper History | Paper Forge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/dashboard.css" rel="stylesheet">
  </head>
  <body data-page="paper-history">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><img class="brand-logo" src="../assets/images/Logo.svg" alt="Paper Forge"><span class="brand-role">Teacher</span></div>
        <a href="/dashboard/teacher-dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/teacher/generate-paper.html"><i class="bi bi-magic"></i> Generate Paper</a>
        <a href="/teacher/chatbot.html"><i class="bi bi-chat-dots"></i> AI Chatbot</a>
        <a href="/teacher/preview-paper.html"><i class="bi bi-file-earmark-text"></i> Preview Paper</a>
        <a class="active" href="/teacher/paper-history.html"><i class="bi bi-clock-history"></i> Paper History</a>
        <button class="js-logout"><i class="bi bi-box-arrow-left"></i> Logout</button>
      </aside>
      <main class="main">
        <div class="topbar">
          <div class="page-title">
            <h1>Paper History</h1>
            <p>View, edit, or delete generated papers.</p>
          </div>
          <a class="btn btn-primary" href="/teacher/generate-paper.html"><i class="bi bi-plus-lg"></i> New Paper</a>
        </div>
        <section class="panel">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Subject</th>
                  <th>Class</th>
                  <th>Questions</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="paperHistoryBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <div id="appToast" hidden></div>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
