<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Practice Setup | Paper Forge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/dashboard.css" rel="stylesheet">
  </head>
  <body data-page="practice-setup">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><img class="brand-logo" src="../assets/images/Logo.svg" alt="Paper Forge"><span class="brand-role">Student</span></div>
        <a href="/dashboard/student-dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="active" href="/student/practice-setup.html"><i class="bi bi-pencil-square"></i> Practice Setup</a>
        <a href="/student/chatbot.html"><i class="bi bi-chat-dots"></i> AI Chatbot</a>
        <a href="/student/result.html"><i class="bi bi-clipboard-check"></i> Results</a>
        <a href="/resources.html"><i class="bi bi-folder2-open"></i> Past Papers & Books</a>
        <a href="/subscription.html"><i class="bi bi-credit-card"></i> Subscription</a>
        <button class="js-logout"><i class="bi bi-box-arrow-left"></i> Logout</button>
      </aside>
      <main class="main">
        <div class="topbar">
          <div class="page-title">
            <h1>Practice Setup</h1>
            <p>Generate a practice paper from available teacher questions.</p>
          </div>
        </div>

        <section class="panel">
          <form id="practiceSetupForm" class="form-grid">
            <div>
              <label class="form-label">Class</label>
              <select class="form-select" name="classLevel" required>
                <option value="9th">9th</option>
                <option value="10th">10th</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
              </select>
            </div>
            <div>
              <label class="form-label">Subject</label>
              <select class="form-select" name="subject" required>
                <option value="Physics">Physics</option>
                <option value="Chemistry">Chemistry</option>
                <option value="Math">Math</option>
              </select>
            </div>
            <div class="span-2">
              <label class="form-label">Chapters</label>
              <div class="check-row" id="practiceChapterChecks"></div>
            </div>
            <div>
              <label class="form-label">MCQ Limit</label>
              <input class="form-control" name="count" type="number" min="1" max="100" value="20">
            </div>
            <div>
              <label class="form-label">Timer</label>
              <input class="form-control" value="1 minute per MCQ" disabled>
            </div>
            <div class="span-2">
              <button class="btn btn-primary" type="submit"><i class="bi bi-play-fill"></i> Generate Practice Paper</button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <div id="appToast" hidden></div>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
