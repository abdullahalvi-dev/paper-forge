<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Past Papers & Books | Paper Forge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/assets/css/dashboard.css" rel="stylesheet">
  </head>
  <body data-page="resources">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><img class="brand-logo" src="/assets/images/Logo.svg" alt="Paper Forge"><span class="brand-role">Library</span></div>
        <a href="/dashboard/student-dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/student/practice-setup.html"><i class="bi bi-pencil-square"></i> Practice</a>
        <a class="active" href="/resources.html"><i class="bi bi-folder2-open"></i> Past Papers & Books</a>
        <a href="/subscription.html"><i class="bi bi-credit-card"></i> Subscription</a>
        <button class="js-logout"><i class="bi bi-box-arrow-left"></i> Logout</button>
      </aside>
      <main class="main">
        <div class="topbar">
          <div class="page-title">
            <h1>Past Papers & Books</h1>
            <p>View and download PDFs uploaded by admin or teachers.</p>
          </div>
        </div>
        <section class="panel" id="resourceUploadPanel">
          <div class="panel-title"><h2>Upload PDF</h2></div>
          <form id="resourceUploadForm" class="form-grid">
            <div><label class="form-label">Title</label><input class="form-control" name="title" required></div>
            <div>
              <label class="form-label">Type</label>
              <select class="form-select" name="type"><option value="past-paper">Past Paper</option><option value="book">Book</option></select>
            </div>
            <div><label class="form-label">Class</label><input class="form-control" name="classLevel"></div>
            <div><label class="form-label">Subject</label><input class="form-control" name="subject"></div>
            <div class="span-2"><label class="form-label">PDF File</label><input class="form-control" type="file" name="file" accept="application/pdf"></div>
            <div class="span-2"><button class="btn btn-primary" type="submit">Upload</button></div>
          </form>
        </section>
        <section class="panel">
          <div class="panel-title"><h2>Library</h2></div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead><tr><th>Title</th><th>Type</th><th>Class</th><th>Subject</th><th>Download</th></tr></thead>
              <tbody id="resourcesBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <div id="appToast" hidden></div>
    <script src="/assets/js/app.js"></script>
  </body>
</html>
