<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users | Paper Forge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/dashboard.css" rel="stylesheet">
  </head>
  <body data-page="users">
    <div class="app-shell admin-shell">
      <aside class="sidebar"></aside>
      <main class="main">
        <div class="topbar admin-topbar">
          <div class="page-title"><h1>Users</h1><p>Search, filter, activate, deactivate, delete, and manage roles.</p></div>
          <button class="btn btn-outline-primary" id="exportUsersBtn"><i class="bi bi-download"></i> Export CSV</button>
        </div>

        <section class="metric-grid">
          <div class="metric-card"><span>Total</span><strong id="usersTotalCount">0</strong></div>
          <div class="metric-card"><span>Active</span><strong id="usersActiveCount">0</strong></div>
          <div class="metric-card"><span>Teachers</span><strong id="usersTeacherCount">0</strong></div>
          <div class="metric-card"><span>Students</span><strong id="usersStudentCount">0</strong></div>
        </section>

        <section class="panel">
          <div class="toolbar-row">
            <div class="d-flex gap-2 flex-wrap">
              <input class="form-control" id="userSearch" placeholder="Search name or email">
              <select class="form-select" id="userRoleFilter">
                <option value="">All roles</option>
                <option value="teacher">Teacher</option>
                <option value="student">Student</option>
                <option value="admin">Admin</option>
              </select>
              <select class="form-select" id="userStatusFilter">
                <option value="">All status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table align-middle compact-table">
              <thead>
                <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr>
              </thead>
              <tbody id="usersBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <div id="appToast" hidden></div>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
