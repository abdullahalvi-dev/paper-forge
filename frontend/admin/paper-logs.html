<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paper Logs | Paper Forge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/dashboard.css" rel="stylesheet">
  </head>
  <body data-page="admin-paper-logs">
    <div class="app-shell admin-shell">
      <aside class="sidebar"></aside>
      <main class="main">
        <div class="topbar admin-topbar">
          <div class="page-title"><h1>Paper Logs</h1><p>Audit teacher and student paper generation activity.</p></div>
          <button class="btn btn-outline-primary" id="exportPaperLogsBtn"><i class="bi bi-download"></i> Export JSON</button>
        </div>

        <section class="metric-grid">
          <div class="metric-card"><span>Total Logs</span><strong id="paperLogsTotalCount">0</strong></div>
          <div class="metric-card"><span>Full Mode</span><strong id="paperLogsFullCount">0</strong></div>
          <div class="metric-card"><span>Custom Mode</span><strong id="paperLogsCustomCount">0</strong></div>
          <div class="metric-card"><span>Order</span><strong style="font-size:1.35rem">MCQ -> Short -> Long</strong></div>
        </section>

        <section class="panel">
          <div class="table-responsive">
            <table class="table align-middle compact-table">
              <thead><tr><th>User</th><th>Role</th><th>Subject</th><th>Chapters</th><th>Mode</th><th>MCQ/Short/Long</th><th>Date</th></tr></thead>
              <tbody id="paperLogsBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <div id="appToast" hidden></div>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
