<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generate Paper | Paper Forge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/dashboard.css" rel="stylesheet">
  </head>
  <body data-page="generate-paper">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><img class="brand-logo" src="../assets/images/Logo.svg" alt="Paper Forge"><span class="brand-role">Teacher</span></div>
        <a href="/dashboard/teacher-dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="active" href="/teacher/generate-paper.html"><i class="bi bi-magic"></i> Generate Paper</a>
        <a href="/teacher/chatbot.html"><i class="bi bi-chat-dots"></i> AI Chatbot</a>
        <a href="/teacher/preview-paper.html"><i class="bi bi-file-earmark-text"></i> Preview Paper</a>
        <a href="/teacher/paper-history.html"><i class="bi bi-clock-history"></i> Paper History</a>
        <a href="/resources.html"><i class="bi bi-folder2-open"></i> Past Papers & Books</a>
        <a href="/subscription.html"><i class="bi bi-credit-card"></i> Subscription</a>
        <button class="js-logout"><i class="bi bi-box-arrow-left"></i> Logout</button>
      </aside>
      <main class="main">
        <div class="topbar">
          <div class="page-title">
            <h1>Generate Paper</h1>
            <p>Select filters. Paper Forge will build the paper from your MongoDB question bank.</p>
          </div>
        </div>

        <section class="panel">
          <div class="panel-title">
            <h2>Paper generator</h2>
            <button class="btn btn-outline-secondary" id="resetGenerateForm" type="button"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
          </div>
          <form id="generatePaperForm" class="form-grid">
            <div class="span-2">
              <label class="form-label">Paper Title</label>
              <input class="form-control" name="title" placeholder="Subject Test" required>
            </div>
            <div>
              <label class="form-label">Class</label>
              <select class="form-select" name="classLevel" required>
                <option value="9th">9th</option>
                <option value="10th">10th</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
              </select>
            </div>
            <div>
              <label class="form-label">Subject</label>
              <select class="form-select" name="subject" required>
                <option value="Physics">Physics</option>
                <option value="Chemistry">Chemistry</option>
                <option value="Math">Math</option>
              </select>
            </div>
            <div class="span-2">
              <label class="form-label">Chapters</label>
              <div class="check-row" id="generateChapterChecks"></div>
            </div>
            <div>
              <label class="form-label">Paper Mode</label>
              <select class="form-select" name="mode">
                <option value="custom" selected>Custom Paper - exact counts</option>
                <option value="full">Full Paper - 100 MCQs, 50 short, 20 long</option>
              </select>
            </div>
            <div>
              <label class="form-label">Time Allowed</label>
              <input class="form-control" name="timeAllowed" value="3 Hours">
            </div>
            <div>
              <label class="form-label">MCQs</label>
              <input class="form-control" name="mcqCount" type="number" min="0" value="20">
            </div>
            <div>
              <label class="form-label">MCQ Marks Each</label>
              <input class="form-control" name="mcqMarks" type="number" min="1" value="1">
            </div>
            <div>
              <label class="form-label">Short Questions</label>
              <input class="form-control" name="shortCount" type="number" min="0" value="10">
            </div>
            <div>
              <label class="form-label">Short Marks Each</label>
              <input class="form-control" name="shortMarks" type="number" min="1" value="3">
            </div>
            <div>
              <label class="form-label">Long Questions</label>
              <input class="form-control" name="longCount" type="number" min="0" value="5">
            </div>
            <div>
              <label class="form-label">Long Marks Each</label>
              <input class="form-control" name="longMarks" type="number" min="1" value="5">
            </div>
            <div>
              <label class="form-label">School / College Name</label>
              <input class="form-control" name="schoolName" value="School / College Name">
            </div>
            <div class="span-2">
              <div class="marks-preview" id="generateMarksPreview"></div>
            </div>
            <div class="span-2">
              <button class="btn btn-primary" type="submit"><i class="bi bi-magic"></i>Generate Paper</button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <div id="appToast" hidden></div>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
